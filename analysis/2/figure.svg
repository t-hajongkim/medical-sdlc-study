<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" font-family="Helvetica, Arial, sans-serif">
  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold">PA vs AP view-position share: Nodule subgroup vs whole cohort</text>

  <!-- Y axis -->
  <line x1="70" y1="40" x2="70" y2="270" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="45" font-size="11">100%</text>
  <text x="28" y="98" font-size="11">75%</text>
  <text x="28" y="156" font-size="11">50%</text>
  <text x="28" y="214" font-size="11">25%</text>
  <text x="35" y="272" font-size="11">0%</text>
  <line x1="66" y1="40" x2="70" y2="40" stroke="#333"/>
  <line x1="66" y1="98" x2="70" y2="98" stroke="#333"/>
  <line x1="66" y1="156" x2="70" y2="156" stroke="#333"/>
  <line x1="66" y1="214" x2="70" y2="214" stroke="#333"/>

  <!-- X axis -->
  <line x1="70" y1="270" x2="480" y2="270" stroke="#333" stroke-width="1.5"/>

  <!-- Group 1: Nodule subgroup (n=12): PA 83% (10/12), AP 17% (2/12) -->
  <g>
    <rect x="130" y="79.9" width="60" height="190.1" fill="#2b6cb0"/>
    <text x="160" y="72" text-anchor="middle" font-size="11" font-weight="bold">83%</text>

    <rect x="200" y="230.9" width="60" height="39.1" fill="#63b3ed"/>
    <text x="230" y="223" text-anchor="middle" font-size="11" font-weight="bold">17%</text>

    <text x="195" y="292" text-anchor="middle" font-size="12">Nodule subgroup</text>
    <text x="195" y="306" text-anchor="middle" font-size="11" fill="#555">(n=12: 10 PA / 2 AP)</text>
  </g>

  <!-- Group 2: whole cohort (n=272): PA 67.6% (184/272), AP 32.4% (88/272) -->
  <g>
    <rect x="320" y="114.4" width="60" height="155.6" fill="#2b6cb0"/>
    <text x="350" y="107" text-anchor="middle" font-size="11" font-weight="bold">68%</text>

    <rect x="390" y="195.6" width="60" height="74.4" fill="#63b3ed"/>
    <text x="420" y="188" text-anchor="middle" font-size="11" font-weight="bold">32%</text>

    <text x="385" y="292" text-anchor="middle" font-size="12">Whole cohort</text>
    <text x="385" y="306" text-anchor="middle" font-size="11" fill="#555">(n=272: 184 PA / 88 AP)</text>
  </g>

  <!-- Legend -->
  <rect x="70" y="320" width="12" height="12" fill="#2b6cb0"/>
  <text x="86" y="330" font-size="11">PA</text>
  <rect x="120" y="320" width="12" height="12" fill="#63b3ed"/>
  <text x="136" y="330" font-size="11">AP</text>

  <text x="480" y="330" font-size="9" fill="#888" text-anchor="end">Source: llm.hospital, GROUP BY view_position</text>
</svg>
